services:
  app:
    build: .
    container_name: beginner-student-app
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/student_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: student_user
      DB_PASSWORD: student_password
      FRONTEND_ORIGIN: "*"
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.4
    container_name: beginner-student-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_db
      MYSQL_USER: student_user
      MYSQL_PASSWORD: student_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
